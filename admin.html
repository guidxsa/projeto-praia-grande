<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notificações</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" integrity="sha384-[HASH-GERADO-AQUI]"
    crossorigin="anonymous"></script>
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://nnnniaoribyqkcxtbpvr.supabase.co; connect-src https://nnnniaoribyqkcxtbpvr.supabase.co;" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
</head>

<body>
  <header class="main-header admin-header-shell" id="admin-header-topo">
    <div class="admin-header-top">
      <div class="page-identity">
        <p class="page-kicker">Painel Administrativo</p>
        <h1>Notificações</h1>
      </div>

      <div class="user-info">
        <span id="nome-usuario-header">Carregando...</span>
        <button id="btn-logout" class="btn-logout">Sair</button>
      </div>
    </div>

    <nav class="admin-navbar">
      <a href="admin.html" class="admin-nav-link" id="nav-estatisticas">Notificações</a>
      <a href="equipe.html" class="admin-nav-link" id="nav-equipe">Gestão de Equipe</a>
      <a href="auditoria.html" class="admin-nav-link" id="nav-auditoria">Histórico de Auditoria</a>
    </nav>
    
    <button id="btn-toggle-admin" class="btn-toggle-header" aria-label="Minimizar menu" aria-expanded="true" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline id="toggle-admin-chevron" points="18 15 12 9 6 15" />
      </svg>
    </button>
  </header>
  <main class="container admin-page-stack">
    <section class="stats-bar-horizontal">
      <div class="stats-info-group">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button id="btn-minhas-noticias" class="btn-minhas-noticias" title="Exibir apenas minhas notícias">
          👤 Minhas Notícias
        </button>
        <button id="btn-nova-notificacao" class="btn-nova">+ Nova Notificação</button>
      </div>
    </section>

    <section class="tables-area">
      <div class="table-container">
        <h3>Notificações Ativas</h3>
        <table class="admin-table">
          <thead>
            <tr>
              <th>Título</th>
              <th>Categoria</th>
              <th>Postado em</th>
              <th>Expira em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-ativas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="modal" class="modal-overlay" style="display: none">
    <div class="modal-form">
      <div class="modal-header">
        <h2>Nova Notificação</h2>
        <button id="btn-fechar-modal-topo" class="close">×</button>
      </div>

      <div class="modal-body">
        <label>Título da notícia</label>
        <input type="text" id="titulo" placeholder="Digite o título principal" />

        <div class="row">
          <div class="col">
            <label>Categoria</label>
            <select id="categoria">
              <option value="Notícia">Notícia</option>
              <option value="Reunião">Reunião</option>
              <option value="Evento">Evento</option>
              <option value="Aviso">Aviso</option>
            </select>
          </div>
          <div class="col">
            <label>Expiração</label>
            <input type="date" id="data-expiracao" />
          </div>
        </div>

        <label>Imagens (opcional — até 5 fotos)</label>
        <div class="upload-area" id="upload-area" style="
              border: 2px dashed #ccc;
              border-radius: 8px;
              padding: 16px;
              text-align: center;
              cursor: pointer;
              background: #fafafa;
            ">
          <span id="upload-label">📁 Clique para selecionar imagens (até 5)</span>
          <input type="file" id="imagem-file" accept="image/*" multiple style="display: none" />
        </div>
        <canvas id="canvas-compressor" style="display: none"></canvas>
        <div id="preview-area" style="display: none; margin-top: 8px">
          <div id="preview-lista" style="display: flex; flex-wrap: wrap; gap: 8px"></div>
        </div>
        <input type="hidden" id="imagem-url" />

        <label>Descrição Curta (para o card)</label>
        <textarea id="descricao" placeholder="Resumo rápido..."></textarea>

        <label>Conteúdo Completo</label>
        <textarea id="conteudo-completo" style="height: 150px"
          placeholder="Escreva o texto completo da notícia aqui..."></textarea>
      </div>

      <div class="modal-footer">
        <button id="btn-cancelar-modal" class="btn-cancelar">Cancelar</button>
        <button id="btn-publicar" class="btn-postar">
          Publicar Notificação
        </button>
      </div>
    </div>
  </div>

  <div id="modal-leitura" class="modal-overlay" style="display: none" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-leitura">
    <div class="modal-content-full">
      <div class="read-progress-bar" id="read-progress-bar"></div>
      <div class="modal-news-shell">
        <button class="close-btn" type="button" id="btn-fechar-noticia" aria-label="Fechar notícia">×</button>
        <div id="conteudo-noticia-foco"></div>
      </div>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>

</html>
